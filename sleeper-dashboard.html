const ScheduleView = ({ league, teamNameOf, myRosterId, nflState }) => {
  const [schedule, setSchedule] = useState(null);
  const [loading, setLoading] = useState(false);
  const [err, setErr] = useState(null);
  const [progress, setProgress] = useState(0);
  const [filterMine, setFilterMine] = useState(true);

  const regWeeks = league.settings?.playoff_week_start ? league.settings.playoff_week_start - 1 : 14;

  useEffect(() => {
    if (!league) return;
    let cancel = false;
    setLoading(true); setErr(null); setSchedule(null); setProgress(0);
    (async () => {
      const weeks = [];
      try {
        for (let w = 1; w <= regWeeks; w++) {
          if (cancel) return;
          const data = await fetchJson(`${API}/league/${league.league_id}/matchups/${w}`);
          weeks.push({ week: w, matchups: data || [] });
          if (!cancel) setProgress(w);
        }
        if (!cancel) setSchedule(weeks);
      } catch (e) {
        if (!cancel) setErr(e.message);
      } finally {
        if (!cancel) setLoading(false);
      }
    })();
    return () => { cancel = true; };
  }, [league, regWeeks]);

  if (err) return <ErrorBox msg={err} />;
  if (loading) {
    return (
      <div className="sd-card" style={{ padding: 24 }}>
        <div style={{ fontSize: 13, color: C.fgMuted }}>Loading schedule… week {progress} / {regWeeks}</div>
        <div style={{ marginTop: 12 }}><Skeleton h={6} w={`${(progress / regWeeks) * 100}%`} /></div>
      </div>
    );
  }
  if (!schedule) return null;

  // If schedule data is empty across all weeks, show empty state
  const totalMatchups = schedule.reduce((sum, w) => sum + w.matchups.length, 0);
  if (totalMatchups === 0) {
    return <Empty title="Schedule not set" hint="The season hasn't started, so matchups haven't been generated yet." />;
  }

  return (
    <div>
      {myRosterId && (
        <div style={{ display: 'flex', alignItems: 'center', gap: 12, marginBottom: 14 }}>
          <label style={{ display: 'flex', alignItems: 'center', gap: 8, fontSize: 13, cursor: 'pointer' }}>
            <input type="checkbox" checked={filterMine} onChange={e => setFilterMine(e.target.checked)} />
            Only my matchups
          </label>
        </div>
      )}

      <div style={{ display: 'grid', gap: 8 }}>
        {schedule.map(({ week, matchups }) => {
          const map = {};
          matchups.forEach(m => { (map[m.matchup_id] ||= []).push(m); });
          let pairs = Object.values(map);
          if (filterMine && myRosterId) {
            pairs = pairs.filter(p => p.some(m => m.roster_id === myRosterId));
            if (pairs.length === 0) return null;
          }
          return (
            <div key={week} className="sd-card" style={{ padding: 14 }}>
              <div style={{ display: 'flex', alignItems: 'baseline', justifyContent: 'space-between', marginBottom: 10 }}>
                <div className="sd-display" style={{ fontSize: 16, fontWeight: 600 }}>Week {week}</div>
                <div style={{ fontSize: 11, color: C.fgSubtle }}>{pairs.length} {pairs.length === 1 ? 'matchup' : 'matchups'}</div>
              </div>
              <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(280px, 1fr))', gap: 8 }}>
                {pairs.map((pair, i) => {
                  const [a, b] = pair;
                  const aIsMe = a?.roster_id === myRosterId;
                  const bIsMe = b?.roster_id === myRosterId;
                  const involved = aIsMe || bIsMe;
                  const played = (a?.points || 0) + (b?.points || 0) > 0;
                  let result = null;
                  if (played && a && b && involved) {
                    const myM = aIsMe ? a : b;
                    const oppM = aIsMe ? b : a;
                    if (myM.points > oppM.points) result = 'W';
                    else if (myM.points < oppM.points) result = 'L';
                    else result = 'T';
                  }
                  return (
                    <div key={i} style={{ padding: 10, background: involved ? '#fbeadc' : C.bgAlt, borderRadius: 3, border: involved ? `1px solid ${C.accent}` : '1px solid transparent' }}>
                      <div style={{ display: 'grid', gridTemplateColumns: '1fr auto', gap: 4, alignItems: 'center' }}>
                        <span style={{ fontSize: 13, fontWeight: aIsMe ? 700 : 500, color: aIsMe ? C.accent : C.fg, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{teamNameOf(a?.roster_id)}</span>
                        <span className="sd-mono" style={{ fontWeight: 700, fontSize: 13 }}>{played ? fmtPts(a?.points) : '—'}</span>
                        <span style={{ fontSize: 13, fontWeight: bIsMe ? 700 : 500, color: bIsMe ? C.accent : C.fg, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{teamNameOf(b?.roster_id)}</span>
                        <span className="sd-mono" style={{ fontWeight: 700, fontSize: 13 }}>{played ? fmtPts(b?.points) : '—'}</span>
                      </div>
                      {result && (
                        <div style={{ marginTop: 6, fontSize: 10, letterSpacing: '0.15em', textTransform: 'uppercase', fontWeight: 700, color: result === 'W' ? C.success : result === 'L' ? C.danger : C.fgMuted }}>
                          {result === 'W' ? 'Won' : result === 'L' ? 'Lost' : 'Tied'}
                        </div>
                      )}
                    </div>
                  );
                })}
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
};

/* ============================================================
   VALUES & TRENDS — FantasyCalc trade values + Sleeper trending
   ============================================================ */

// Parse FantasyCalc pick names like "2026 Mid 1st", "2026 Early 1st", "2026 1st",
// "2026 1.05", "Pick 1.01 2026", "2026 Round 1", "2026 Rookie 1st", etc.
const parsePickName = (name) => {
  if (!name || typeof name !== 'string') return null;
  // Year: any 20XX between 2020-2049
  const yearMatch = name.match(/(20[2-4]\d)/);
  if (!yearMatch) return null;
  const season = yearMatch[1];
  // Tier: Early/Mid/Late (case-insensitive, anywhere in string)
  const tierMatch = name.match(/\b(early|mid|late)\b/i);
  const tier = tierMatch ? tierMatch[1].toLowerCase() : null;
  // Round: try multiple patterns in priority order
  let round = null;
  let slot = null;
  // Pattern A: ordinal — "1st", "2nd", "3rd", "4th", "5th"
  let m = name.match(/\b(\d{1,2})(?:st|nd|rd|th)\b/i);
  if (m) {
    const r = parseInt(m[1], 10);
    if (r >= 1 && r <= 7) round = r;
  }
  // Pattern B: round.slot — "1.05", "Pick 2.10"
  if (!round) {
    m = name.match(/(\d{1,2})\.(\d{1,2})/);
    if (m) {
      const r = parseInt(m[1], 10), s = parseInt(m[2], 10);
      if (r >= 1 && r <= 7) { round = r; slot = s; }
    }
  }
  // Pattern C: explicit "Round X" / "Rd X" / "R X"
  if (!round) {
    m = name.match(/\br(?:ound|d)?\.?\s*(\d{1,2})\b/i);
    if (m) {
      const r = parseInt(m[1], 10);
      if (r >= 1 && r <= 7) round = r;
    }
  }
  if (!round) return null;
  return { season, tier, round, slot };
};

// Map draft slot (1-N) to tier label given league size; splits into thirds
const slotToTier = (slot, totalTeams) => {
  if (!slot || !totalTeams) return 'mid';
  const earlyMax = Math.ceil(totalTeams / 3);
  const midMax = Math.ceil((totalTeams * 2) / 3);
  if (slot <= earlyMax) return 'early';
  if (slot <= midMax) return 'mid';
  return 'late';
};

// In a snake draft, even rounds reverse the order
const effectiveSlot = (slot, round, totalTeams, isSnake) => {
  if (!isSnake || round % 2 === 1) return slot;
  return totalTeams - slot + 1;
};

const ordinal = (n) => {
  const s = ['th', 'st', 'nd', 'rd'];
  const v = n % 100;
  return n + (s[(v - 20) % 10] || s[v] || s[0]);
};

const ValuesTrendsView = ({ league, rosters, teamNameOf, userByRosterId, myRosterId, playersDb, loadingPlayers, ensurePlayers }) => {
  const [values, setValues] = useState(null);
  const [trendAdd, setTrendAdd] = useState(null);
  const [trendDrop, setTrendDrop] = useState(null);
  const [tradedPicks, setTradedPicks] = useState(null);
  const [previousRosters, setPreviousRosters] = useState([]);
  const [draftType, setDraftType] = useState('snake');
  const [loading, setLoading] = useState(false);
  const [err, setErr] = useState(null);

  // Derive FantasyCalc params from league settings — DYNASTY mode
  const fcParams = useMemo(() => {
    const scoring = league.scoring_settings || {};
    const rec = scoring.rec || 0;
    const ppr = rec >= 1 ? 1 : rec >= 0.5 ? 0.5 : 0;
    const isSuperflex = (league.roster_positions || []).includes('SUPER_FLEX');
    const teams = league.total_rosters || 12;
    const validTeamCounts = [8, 10, 12, 14, 16];
    const numTeams = validTeamCounts.reduce((closest, t) =>
      Math.abs(t - teams) < Math.abs(closest - teams) ? t : closest, 12);
    return { isDynasty: true, numQbs: isSuperflex ? 2 : 1, numTeams, ppr };
  }, [league]);

  useEffect(() => {
    if (!league) return;
    let cancel = false;
    setLoading(true); setErr(null);
    ensurePlayers();
    const url = `${FANTASYCALC_API}?isDynasty=${fcParams.isDynasty}&numQbs=${fcParams.numQbs}&numTeams=${fcParams.numTeams}&ppr=${fcParams.ppr}`;
    Promise.all([
      fetchJson(url),
      fetchJson(`${API}/players/nfl/trending/add?lookback_hours=24&limit=25`),
      fetchJson(`${API}/players/nfl/trending/drop?lookback_hours=24&limit=15`),
      fetchJson(`${API}/league/${league.league_id}/traded_picks`).catch(() => []),
      league.previous_league_id ? fetchJson(`${API}/league/${league.previous_league_id}/rosters`).catch(() => []) : Promise.resolve([]),
      league.draft_id ? fetchJson(`${API}/draft/${league.draft_id}`).catch(() => null) : Promise.resolve(null),
    ]).then(([v, ta, td, tp, prevR, draft]) => {
      if (cancel) return;
      setValues(Array.isArray(v) ? v : []);
      setTrendAdd(ta || []);
      setTrendDrop(td || []);
      setTradedPicks(tp || []);
      setPreviousRosters(prevR || []);
      setDraftType(draft?.type || 'snake');
    }).catch(e => { if (!cancel) setErr(e.message); })
      .finally(() => { if (!cancel) setLoading(false); });
    return () => { cancel = true; };
  }, [league, fcParams.isDynasty, fcParams.numQbs, fcParams.numTeams, fcParams.ppr, ensurePlayers]);

  // Split values: players (have sleeperId) vs picks (have parseable name)
  // Build a nested lookup: pickValueByYearRound[year][round][tier] = value
  // Also track diagnostic counts so we can surface parse failures to the user.
  const { playerValueOf, pickValueByYRT, pickAvgByYearRound, diagnostics } = useMemo(() => {
    const playerMap = {};
    const pickByYRT = {};
    const pickGroups = {};
    const unparsedPickNames = [];
    let playerCount = 0;
    let pickCount = 0;
    let nonPlayerEntries = 0;

    (values || []).forEach(v => {
      const sid = v.player?.sleeperId;
      const pos = v.player?.position;
      const isPickByMarker = !sid || pos === 'PICK' || pos === 'RDP';
      if (sid && !isPickByMarker) {
        // It's a real player
        playerMap[sid] = { value: v.value, overallRank: v.overallRank, positionRank: v.positionRank, trend30: v.trend30Day };
        playerCount++;
      } else {
        // Treat as pick
        nonPlayerEntries++;
        const parsed = parsePickName(v.player?.name || '');
        if (parsed) {
          const { season, round, tier, slot } = parsed;
          if (!pickByYRT[season]) pickByYRT[season] = {};
          if (!pickByYRT[season][round]) pickByYRT[season][round] = {};
          const teams = fcParams.numTeams;
          const tierKey = tier || (slot ? slotToTier(slot, teams) : 'mid');
          pickByYRT[season][round][tierKey] = v.value;
          (pickGroups[`${season}-${round}`] ||= []).push(v.value);
          pickCount++;
        } else if (v.player?.name) {
          unparsedPickNames.push(v.player.name);
        }
      }
    });

    const avg = {};
    Object.entries(pickGroups).forEach(([key, arr]) => {
      avg[key] = arr.reduce((s, n) => s + n, 0) / arr.length;
    });

    return {
      playerValueOf: playerMap,
      pickValueByYRT: pickByYRT,
      pickAvgByYearRound: avg,
      diagnostics: { playerCount, pickCount, nonPlayerEntries, unparsedPickNames, sampleUnparsed: unparsedPickNames.slice(0, 3) },
    };
  }, [values, fcParams.numTeams]);

  // Compute draft order for each year of future picks
  // - N+1 picks (next draft): use current league in-progress standings (worst → pick 1)
  //   Falls back to prior-year standings (via previous_league_id rosters) if no games played yet
  // - N+2 picks (year after next): use prior-year standings as best available proxy
  const { draftOrders, orderSource } = useMemo(() => {
    const currentYear = parseInt(league.season || '2025', 10);
    const totalTeams = rosters.length;

    const orderFromRosterList = (rs) => {
      const sorted = [...rs].sort((a, b) => {
        const aw = a.settings?.wins || 0;
        const bw = b.settings?.wins || 0;
        if (aw !== bw) return aw - bw; // worst record first
        const af = (a.settings?.fpts || 0) + (a.settings?.fpts_decimal || 0) / 100;
        const bf = (b.settings?.fpts || 0) + (b.settings?.fpts_decimal || 0) / 100;
        return af - bf; // lower points scored first (worse team)
      });
      const order = {};
      sorted.forEach((r, i) => { order[r.roster_id] = i + 1; });
      return order;
    };

    // Build prior-year projection: each current roster mapped to their owner's prior settings
    const prevByOwner = {};
    previousRosters.forEach(r => { if (r.owner_id) prevByOwner[r.owner_id] = r; });
    const priorProjection = rosters.map(r => {
      const prev = prevByOwner[r.owner_id];
      return {
        roster_id: r.roster_id,
        settings: prev?.settings || r.settings || {}, // new owners fall back to current
        _hasPrev: !!prev,
      };
    });

    const hasGames = rosters.some(r => (r.settings?.wins || 0) + (r.settings?.losses || 0) > 0);
    const orders = {};
    const sources = {};

    // N+1: current standings if games played; else prior-year projection
    if (hasGames) {
      orders[currentYear + 1] = orderFromRosterList(rosters);
      sources[currentYear + 1] = 'Current season standings (in-progress)';
    } else if (previousRosters.length > 0) {
      orders[currentYear + 1] = orderFromRosterList(priorProjection);
      sources[currentYear + 1] = 'Prior season (final standings) — projection';
    } else {
      orders[currentYear + 1] = orderFromRosterList(rosters);
      sources[currentYear + 1] = 'Current rosters (no prior data)';
    }

    // N+2: prior year projection
    if (previousRosters.length > 0) {
      orders[currentYear + 2] = orderFromRosterList(priorProjection);
      sources[currentYear + 2] = 'Prior season — long-range projection';
    } else if (hasGames) {
      orders[currentYear + 2] = orderFromRosterList(rosters);
      sources[currentYear + 2] = 'Current season — long-range projection';
    } else {
      orders[currentYear + 2] = orderFromRosterList(rosters);
      sources[currentYear + 2] = 'Current rosters (no prior data)';
    }
    return { draftOrders: orders, orderSource: sources };
  }, [rosters, previousRosters, league]);

  // Slot-aware value lookup for a pick: factors in standings projection + snake flipping
  const valueForPick = useCallback((season, round, originalRoster) => {
    const order = draftOrders[parseInt(season, 10)];
    const slot = order?.[originalRoster];
    const totalTeams = rosters.length || 12;
    const isSnake = draftType === 'snake';
    const effSlot = slot ? effectiveSlot(slot, round, totalTeams, isSnake) : null;
    const tier = effSlot ? slotToTier(effSlot, totalTeams) : 'mid';
    const yrRound = pickValueByYRT[season]?.[round];
    if (yrRound) {
      return {
        value: yrRound[tier] ?? yrRound.mid ?? yrRound.early ?? yrRound.late ?? (pickAvgByYearRound[`${season}-${round}`] || 0),
        slot, effSlot, tier,
      };
    }
    return { value: pickAvgByYearRound[`${season}-${round}`] || 0, slot, effSlot, tier };
  }, [draftOrders, draftType, rosters, pickValueByYRT, pickAvgByYearRound]);

  // Compute pick ownership per roster, with slot-specific values
  // CRITICAL: use the years that FantasyCalc actually returned values for,
  // not hardcoded [N+1, N+2]. FantasyCalc may return different years depending
  // on whether the current season's rookie draft has happened, etc.
  const { pickOwnership, pickYears } = useMemo(() => {
    if (!rosters || rosters.length === 0) return { pickOwnership: {}, pickYears: [] };
    const currentYear = parseInt(league.season || '2025', 10);

    // Years that FantasyCalc has values for — these are the years we trust
    const fcYears = Object.keys(pickValueByYRT)
      .map(s => parseInt(s, 10))
      .filter(y => !isNaN(y) && y >= currentYear && y <= currentYear + 5)
      .sort((a, b) => a - b);

    // If FC returned years, use them. Otherwise fall back to N+1, N+2.
    const years = fcYears.length > 0 ? fcYears.slice(0, 3) : [currentYear + 1, currentYear + 2];
    const ROOKIE_ROUNDS = 4;

    const tradeMap = {};
    (tradedPicks || []).forEach(t => {
      const key = `${t.season}-${t.round}-${t.roster_id}`;
      tradeMap[key] = t.owner_id;
    });

    const ownership = {};
    rosters.forEach(r => { ownership[r.roster_id] = []; });

    years.forEach(yr => {
      for (let rd = 1; rd <= ROOKIE_ROUNDS; rd++) {
        rosters.forEach(r => {
          const key = `${yr}-${rd}-${r.roster_id}`;
          const ownerId = tradeMap[key] !== undefined ? tradeMap[key] : r.roster_id;
          const info = valueForPick(String(yr), rd, r.roster_id);
          if (!ownership[ownerId]) ownership[ownerId] = [];
          ownership[ownerId].push({
            season: String(yr),
            round: rd,
            originalRoster: r.roster_id,
            value: info.value,
            slot: info.slot,
            effSlot: info.effSlot,
            tier: info.tier,
            traded: tradeMap[key] !== undefined,
          });
        });
      }
    });
    return { pickOwnership: ownership, pickYears: years };
  }, [tradedPicks, rosters, league, valueForPick, pickValueByYRT]);

  // Generic pick items for trade comparator (averaged value)
  const pickItems = useMemo(() => {
    const items = [];
    pickYears.forEach(yr => {
      for (let rd = 1; rd <= 4; rd++) {
        const value = pickAvgByYearRound[`${yr}-${rd}`] || 0;
        items.push({
          id: `pick:${yr}:${rd}`,
          name: `${yr} ${ordinal(rd)} Round Pick`,
          shortName: `${yr} ${ordinal(rd)}`,
          season: String(yr),
          round: rd,
          value,
          isPick: true,
        });
      }
    });
    return items;
  }, [pickYears, pickAvgByYearRound]);

  if (err) return <ErrorBox msg={err} />;
  if (loading || (loadingPlayers && !playersDb)) {
    return (
      <div className="sd-card" style={{ padding: 24 }}>
        <Skeleton h={20} w="40%" />
        <div style={{ marginTop: 12, fontSize: 12, color: C.fgMuted }}>
          Loading dynasty values · trending · pick trades · prior season standings…
        </div>
      </div>
    );
  }
  if (!values || values.length === 0) {
    return <Empty title="No value data available" hint="FantasyCalc may be temporarily unreachable. Try Refresh in the header." />;
  }

  return (
    <div style={{ display: 'grid', gap: 16 }}>
      <SettingsBanner fcParams={fcParams} draftType={draftType} hasPrev={previousRosters.length > 0} diagnostics={diagnostics} />
      <LeagueValueRankings rosters={rosters} valueOf={playerValueOf} teamNameOf={teamNameOf} userByRosterId={userByRosterId} myRosterId={myRosterId} pickOwnership={pickOwnership} />
      <PicksByTeamCard rosters={rosters} pickOwnership={pickOwnership} teamNameOf={teamNameOf} myRosterId={myRosterId} pickYears={pickYears} userByRosterId={userByRosterId} orderSource={orderSource} totalTeams={rosters.length} />
      <TopPlayersCard values={values} myRosterId={myRosterId} rosters={rosters} valueOf={playerValueOf} pickItems={pickItems} />
      <TrendingCard trendAdd={trendAdd} trendDrop={trendDrop} playersDb={playersDb} valueOf={playerValueOf} myRosterId={myRosterId} rosters={rosters} />
      <TradeComparatorCard playersDb={playersDb} valueOf={playerValueOf} myRosterId={myRosterId} rosters={rosters} teamNameOf={teamNameOf} pickItems={pickItems} pickAvgByYearRound={pickAvgByYearRound} />
    </div>
  );
};

const SettingsBanner = ({ fcParams, draftType, hasPrev, diagnostics }) => {
  const d = diagnostics || {};
  const parseOk = d.pickCount > 0;
  const parseWarn = d.nonPlayerEntries > 0 && d.pickCount === 0;

  return (
    <div style={{ padding: '8px 14px', fontSize: 11, color: C.fgMuted, background: C.bgAlt, border: `1px solid ${C.border}`, borderRadius: 3 }}>
      <div>
        Values auto-tuned:&nbsp;
        <strong style={{ color: C.accent }}>Dynasty</strong> ·&nbsp;
        <strong style={{ color: C.fg }}>{fcParams.ppr >= 1 ? 'PPR' : fcParams.ppr >= 0.5 ? 'Half-PPR' : 'Standard'}</strong> ·&nbsp;
        <strong style={{ color: C.fg }}>{fcParams.numTeams}-team</strong> ·&nbsp;
        <strong style={{ color: C.fg }}>{fcParams.numQbs === 2 ? 'Superflex' : '1-QB'}</strong> ·&nbsp;
        <strong style={{ color: C.fg }}>{draftType === 'snake' ? 'Snake' : 'Linear'}</strong> rookie draft ·&nbsp;
        Pick values: {hasPrev ? 'prior-year + current standings' : 'current standings only'} · Source: FantasyCalc
      </div>
      {diagnostics && (
        <div style={{ marginTop: 4, fontSize: 10, color: parseWarn ? C.danger : C.fgSubtle }}>
          <span className="sd-mono">
            Parsed: {d.playerCount} players · {d.pickCount} picks{parseOk ? ' ✓' : ''}
            {d.nonPlayerEntries > d.pickCount && (
              <span style={{ color: C.danger, marginLeft: 8 }}>
                ({d.nonPlayerEntries - d.pickCount} pick entries couldn't be parsed)
              </span>
            )}
          </span>
          {parseWarn && d.sampleUnparsed?.length > 0 && (
            <div style={{ marginTop: 2, color: C.danger }}>
              ⚠ Pick names not recognised — examples: {d.sampleUnparsed.map(n => `"${n}"`).join(', ')}. Pick values will fall back to 0.
            </div>
          )}
        </div>
      )}
    </div>
  );
};

const LeagueValueRankings = ({ rosters, valueOf, teamNameOf, userByRosterId, myRosterId, pickOwnership }) => {
  const ranked = useMemo(() => {
    return [...rosters].map(r => {
      const players = r.players || [];
      const starters = r.starters || [];
      const playerTotal = players.reduce((sum, pid) => sum + (valueOf[pid]?.value || 0), 0);
      const startersTotal = starters.reduce((sum, pid) => sum + (valueOf[pid]?.value || 0), 0);
      const picks = pickOwnership?.[r.roster_id] || [];
      const pickTotal = picks.reduce((sum, p) => sum + (p.value || 0), 0);
      return { roster: r, playerTotal, pickTotal, startersTotal, total: playerTotal + pickTotal };
    }).sort((a, b) => b.total - a.total);
  }, [rosters, valueOf, pickOwnership]);

  if (ranked.length === 0) return null;
  const maxTotal = ranked[0].total || 1;

  return (
    <div className="sd-card" style={{ overflow: 'hidden' }}>
      <div style={{ padding: '14px 16px', borderBottom: `1px solid ${C.border}`, display: 'flex', alignItems: 'baseline', justifyContent: 'space-between' }}>
        <div className="sd-display" style={{ fontSize: 18, fontWeight: 600 }}>Roster Value — League Rankings</div>
        <div style={{ fontSize: 11, color: C.fgSubtle }}>Players + future picks · FantasyCalc dynasty values</div>
      </div>
      <table className="sd-table">
        <thead>
          <tr>
            <th style={{ width: 40 }}>#</th>
            <th>Team</th>
            <th style={{ width: '32%' }}>Total Value</th>
            <th style={{ textAlign: 'right', width: 90 }}>Starters</th>
            <th style={{ textAlign: 'right', width: 90 }}>Players</th>
            <th style={{ textAlign: 'right', width: 80 }}>Picks</th>
            <th style={{ textAlign: 'right', width: 90 }}>Total</th>
          </tr>
        </thead>
        <tbody>
          {ranked.map((row, i) => {
            const isMe = row.roster.roster_id === myRosterId;
            const u = userByRosterId[row.roster.roster_id];
            const pct = (row.total / maxTotal) * 100;
            return (
              <tr key={row.roster.roster_id} className={`sd-row-hover ${isMe ? 'sd-row-me' : ''}`}>
                <td><span className="sd-mono" style={{ fontSize: 13, fontWeight: 700, color: C.fgMuted }}>{i + 1}</span></td>
                <td>
                  <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
                    <Avatar url={avatarUrl(u?.avatar)} name={u?.display_name} />
                    <span style={{ fontWeight: 600, fontSize: 13 }}>{teamNameOf(row.roster.roster_id)}</span>
                  </div>
                </td>
                <td>
                  <div style={{ background: C.bgAlt, height: 8, borderRadius: 2, overflow: 'hidden' }}>
                    <div style={{ background: isMe ? C.accent : C.ink, height: '100%', width: `${pct}%`, transition: 'width 0.3s' }} />
                  </div>
                </td>
                <td className="sd-mono" style={{ textAlign: 'right', color: C.fgMuted, fontSize: 13 }}>{Math.round(row.startersTotal).toLocaleString()}</td>
                <td className="sd-mono" style={{ textAlign: 'right', color: C.fg, fontSize: 13 }}>{Math.round(row.playerTotal).toLocaleString()}</td>
                <td className="sd-mono" style={{ textAlign: 'right', color: C.fgMuted, fontSize: 12 }}>{Math.round(row.pickTotal).toLocaleString()}</td>
                <td className="sd-mono" style={{ textAlign: 'right', fontWeight: 700, fontSize: 13 }}>{Math.round(row.total).toLocaleString()}</td>
              </tr>
            );
          })}
        </tbody>
      </table>
    </div>
  );
};

const PicksByTeamCard = ({ rosters, pickOwnership, teamNameOf, myRosterId, pickYears, userByRosterId, orderSource, totalTeams }) => {
  const [expanded, setExpanded] = useState(null);

  useEffect(() => { if (myRosterId) setExpanded(myRosterId); }, [myRosterId]);

  if (!pickOwnership || Object.keys(pickOwnership).length === 0) return null;

  const sortedRosters = [...rosters].map(r => {
    const picks = pickOwnership[r.roster_id] || [];
    const total = picks.reduce((s, p) => s + (p.value || 0), 0);
    return { roster: r, picks, total };
  }).sort((a, b) => b.total - a.total);

  return (
    <div className="sd-card" style={{ overflow: 'hidden' }}>
      <div style={{ padding: '14px 16px', borderBottom: `1px solid ${C.border}` }}>
        <div className="sd-display" style={{ fontSize: 18, fontWeight: 600 }}>Future Rookie Picks by Team</div>
        <div style={{ fontSize: 11, color: C.fgSubtle, marginTop: 4, lineHeight: 1.6 }}>
          {pickYears.map(y => y).join(' & ')} · rounds 1–4 · Values projected by draft slot (worse standings → earlier pick → higher value)
        </div>
        {orderSource && (
          <div style={{ marginTop: 6, fontSize: 10, color: C.fgSubtle }}>
            {pickYears.map(yr => (
              <div key={yr}>
                <span className="sd-mono" style={{ color: C.fg }}>{yr}</span> draft order: {orderSource[yr]}
              </div>
            ))}
          </div>
        )}
      </div>
      <div>
        {sortedRosters.map(({ roster, picks, total }) => {
          const isMe = roster.roster_id === myRosterId;
          const isOpen = expanded === roster.roster_id;
          const u = userByRosterId[roster.roster_id];
          const byYear = {};
          picks.forEach(p => { (byYear[p.season] ||= []).push(p); });

          return (
            <div key={roster.roster_id} style={{ borderBottom: `1px solid ${C.border}` }}>
              <button
                onClick={() => setExpanded(isOpen ? null : roster.roster_id)}
                style={{
                  width: '100%', padding: '12px 16px', display: 'flex', alignItems: 'center', justifyContent: 'space-between',
                  background: isMe ? 'rgba(176,74,28,0.04)' : 'transparent', border: 'none', cursor: 'pointer', textAlign: 'left',
                }}
              >
                <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
                  <Avatar url={avatarUrl(u?.avatar)} name={u?.display_name} size={28} />
                  <div>
                    <div style={{ fontWeight: 700, fontSize: 13, color: isMe ? C.accent : C.fg }}>
                      {teamNameOf(roster.roster_id)}{isMe && <span style={{ marginLeft: 6, fontSize: 9, letterSpacing: '0.1em', textTransform: 'uppercase', background: C.accent, color: C.bg, padding: '1px 5px', borderRadius: 2 }}>You</span>}
                    </div>
                    <div style={{ fontSize: 11, color: C.fgSubtle }}>{picks.length} picks</div>
                  </div>
                </div>
                <div style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
                  <div className="sd-mono" style={{ fontSize: 14, fontWeight: 700 }}>{Math.round(total).toLocaleString()}</div>
                  <span style={{ fontSize: 11, color: C.fgMuted }}>{isOpen ? '▼' : '▶'}</span>
                </div>
              </button>
              {isOpen && (
                <div className="sd-fade-in" style={{ padding: '4px 16px 14px', background: C.bgAlt }}>
                  {Object.entries(byYear).sort().map(([year, yearPicks]) => (
                    <div key={year} style={{ marginTop: 10 }}>
                      <div style={{ fontSize: 10, letterSpacing: '0.15em', textTransform: 'uppercase', color: C.fgSubtle, fontWeight: 700, marginBottom: 6 }}>{year}</div>
                      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(190px, 1fr))', gap: 6 }}>
                        {yearPicks.sort((a, b) => a.round - b.round || (a.slot || 99) - (b.slot || 99)).map((p, i) => {
                          const fromAnother = p.originalRoster !== roster.roster_id;
                          // Pick slot notation: round.effSlot (e.g., 1.05). In snake, effSlot already accounts for round flip.
                          const slotLabel = p.effSlot ? `${p.round}.${String(p.effSlot).padStart(2, '0')}` : `R${p.round}`;
                          const tierLabel = p.tier ? p.tier.charAt(0).toUpperCase() + p.tier.slice(1) : '';
                          const tierColor = p.tier === 'early' ? C.success : p.tier === 'late' ? C.danger : C.fgMuted;
                          return (
                            <div key={`${p.season}-${p.round}-${i}`} style={{
                              padding: '7px 10px', background: C.card, borderRadius: 3,
                              border: `1px solid ${fromAnother ? C.accent : C.border}`,
                            }}>
                              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 2 }}>
                                <div style={{ fontSize: 12, fontWeight: 700 }}>{p.season} {ordinal(p.round)}</div>
                                <div className="sd-mono" style={{ fontSize: 12, fontWeight: 700 }}>{Math.round(p.value).toLocaleString()}</div>
                              </div>
                              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', fontSize: 10, color: C.fgMuted }}>
                                <span className="sd-mono">
                                  Proj. {slotLabel}{tierLabel && <span style={{ color: tierColor, marginLeft: 4, fontWeight: 700 }}>· {tierLabel}</span>}
                                </span>
                                {fromAnother && (
                                  <span style={{ color: C.accent, fontSize: 9, textTransform: 'uppercase', letterSpacing: '0.05em', fontWeight: 700 }}>
                                    via {teamNameOf(p.originalRoster).slice(0, 12)}
                                  </span>
                                )}
                              </div>
                            </div>
                          );
                        })}
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
};

const TopPlayersCard = ({ values, myRosterId, rosters, valueOf }) => {
  const [pos, setPos] = useState('ALL');
  const positions = ['ALL', 'QB', 'RB', 'WR', 'TE', 'PICK'];

  // Who's on which roster
  const ownerByPlayerId = useMemo(() => {
    const map = {};
    rosters.forEach(r => (r.players || []).forEach(pid => { map[pid] = r.roster_id; }));
    return map;
  }, [rosters]);

  const filtered = useMemo(() => {
    return (values || [])
      .filter(v => {
        if (pos === 'ALL') return true;
        if (pos === 'PICK') return !v.player?.sleeperId;
        return v.player?.position === pos && v.player?.sleeperId;
      })
      .slice(0, 40);
  }, [values, pos]);

  return (
    <div className="sd-card" style={{ overflow: 'hidden' }}>
      <div style={{ padding: '14px 16px', borderBottom: `1px solid ${C.border}` }}>
        <div className="sd-display" style={{ fontSize: 18, fontWeight: 600, marginBottom: 10 }}>Top Assets by Trade Value</div>
        <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap' }}>
          {positions.map(p => (
            <button key={p} onClick={() => setPos(p)} style={{
              padding: '4px 10px', fontSize: 11, fontWeight: 700, letterSpacing: '0.05em',
              background: pos === p ? C.ink : 'transparent', color: pos === p ? C.bg : C.fg,
              border: `1px solid ${pos === p ? C.ink : C.border}`, borderRadius: 3, cursor: 'pointer',
            }}>{p === 'PICK' ? 'PICKS' : p}</button>
          ))}
        </div>
      </div>
      <div style={{ maxHeight: 480, overflowY: 'auto' }} className="sd-scrollbar">
        <table className="sd-table">
          <thead>
            <tr>
              <th style={{ width: 36 }}>#</th>
              <th>Asset</th>
              <th style={{ width: 56 }}>Type</th>
              <th style={{ textAlign: 'right', width: 80 }}>Value</th>
              <th style={{ textAlign: 'right', width: 80 }}>30d Δ</th>
              <th style={{ textAlign: 'right', width: 110 }}>Owner</th>
            </tr>
          </thead>
          <tbody>

              const p = v.player || {};
              const sid = p.sleeperId;
              const isPick = !sid;
              const owner = sid ? ownerByPlayerId[sid] : null;
              const isMyPlayer = owner === myRosterId;
              const trend = v.trend30Day || 0;
              return (
                <tr key={p.id || sid || i} className="sd-row-hover">
                  <td><span className="sd-mono" style={{ fontSize: 12, color: C.fgSubtle }}>{i + 1}</span></td>
                  <td>
                    <div style={{ fontWeight: 600, fontSize: 13 }}>
                      {p.name}
                      {isMyPlayer && <span style={{ marginLeft: 6, fontSize: 9, letterSpacing: '0.1em', textTransform: 'uppercase', background: C.accent, color: C.bg, padding: '1px 5px', borderRadius: 2 }}>You</span>}
                    </div>
                  </td>
                  <td><PosTag pos={isPick ? 'PICK' : (p.position || '?')} /></td>
                  <td className="sd-mono" style={{ textAlign: 'right', fontWeight: 700 }}>{Math.round(v.value || 0).toLocaleString()}</td>
                  <td className="sd-mono" style={{ textAlign: 'right', color: trend > 0 ? C.success : trend < 0 ? C.danger : C.fgMuted, fontSize: 12 }}>
                    {trend > 0 ? '+' : ''}{Math.round(trend)}
                  </td>
                  <td style={{ textAlign: 'right', fontSize: 11, color: C.fgSubtle }}>
                    {isPick ? 'See Picks card' : (owner ? (isMyPlayer ? 'You' : 'Rostered') : 'Free agent')}
                  </td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
    </div>
  );
};

const TrendingCard = ({ trendAdd, trendDrop, playersDb, valueOf, myRosterId, rosters }) => {
  const ownedByMe = useMemo(() => {
    if (!myRosterId) return new Set();
    const my = rosters.find(r => r.roster_id === myRosterId);
    return new Set(my?.players || []);
  }, [rosters, myRosterId]);

  const renderRow = (item) => {
    const pid = item.player_id;
    const p = playersDb?.[pid];
    const val = valueOf[pid]?.value;
    const mine = ownedByMe.has(pid);
    if (!p) return null;
    const name = p.full_name || `${p.first_name || ''} ${p.last_name || ''}`.trim() || pid;
    return (
      <div key={pid} className="sd-row-hover" style={{ display: 'flex', alignItems: 'center', padding: '6px 8px', gap: 8 }}>
        <PosTag pos={p.position || '?'} />
        <div style={{ flex: 1, minWidth: 0 }}>
          <div style={{ fontSize: 13, fontWeight: 600, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>
            {name}
            {mine && <span style={{ marginLeft: 6, fontSize: 9, letterSpacing: '0.1em', textTransform: 'uppercase', background: C.accent, color: C.bg, padding: '1px 5px', borderRadius: 2 }}>You</span>}
          </div>
          <div style={{ fontSize: 10, color: C.fgSubtle }}>{p.team || 'FA'} · {item.count.toLocaleString()} moves (24h)</div>
        </div>
        {val !== undefined && (
          <div className="sd-mono" style={{ fontSize: 12, fontWeight: 700, color: C.fg }}>{Math.round(val).toLocaleString()}</div>
        )}
      </div>
    );
  };

  return (
    <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(280px, 1fr))', gap: 16 }}>
      <div className="sd-card" style={{ padding: 14 }}>
        <div className="sd-display" style={{ fontSize: 16, fontWeight: 600, marginBottom: 4 }}>↗ Trending Adds</div>
        <div style={{ fontSize: 11, color: C.fgSubtle, marginBottom: 10 }}>Most-added players across all leagues, last 24 hours</div>
        <div style={{ display: 'grid', gap: 2 }}>
          {(trendAdd || []).slice(0, 12).map(renderRow)}
          {(!trendAdd || trendAdd.length === 0) && <div style={{ fontSize: 12, color: C.fgMuted }}>None.</div>}
        </div>
      </div>
      <div className="sd-card" style={{ padding: 14 }}>
        <div className="sd-display" style={{ fontSize: 16, fontWeight: 600, marginBottom: 4 }}>↘ Trending Drops</div>
        <div style={{ fontSize: 11, color: C.fgSubtle, marginBottom: 10 }}>Most-dropped players across all leagues, last 24 hours</div>
        <div style={{ display: 'grid', gap: 2 }}>
          {(trendDrop || []).slice(0, 10).map(renderRow)}
          {(!trendDrop || trendDrop.length === 0) && <div style={{ fontSize: 12, color: C.fgMuted }}>None.</div>}
        </div>
      </div>
    </div>
  );
};

const TradeComparatorCard = ({ playersDb, valueOf, myRosterId, rosters, teamNameOf, pickItems, pickAvgByYearRound }) => {
  const [sideA, setSideA] = useState([]);
  const [sideB, setSideB] = useState([]);

  useEffect(() => {
    setSideA([]); setSideB([]);
  }, [myRosterId]);

  // Helper: get value for any item ID (player or pick)
  const valueOfItem = (id) => {
    if (id.startsWith('pick:')) {
      const [_, yr, rd] = id.split(':');
      return pickAvgByYearRound?.[`${yr}-${rd}`] || 0;
    }
    return valueOf[id]?.value || 0;
  };

  const totalA = sideA.reduce((sum, id) => sum + valueOfItem(id), 0);
  const totalB = sideB.reduce((sum, id) => sum + valueOfItem(id), 0);
  const diff = totalA - totalB;
  const winner = Math.abs(diff) < 100 ? 'even' : (diff > 0 ? 'A' : 'B');

  const remove = (side, id) => {
    if (side === 'A') setSideA(s => s.filter(p => p !== id));
    else setSideB(s => s.filter(p => p !== id));
  };

  return (
    <div className="sd-card" style={{ padding: 16 }}>
      <div className="sd-display" style={{ fontSize: 18, fontWeight: 600, marginBottom: 4 }}>Trade Comparator</div>
      <div style={{ fontSize: 11, color: C.fgSubtle, marginBottom: 16 }}>
        Search players or picks (try "2026 1st"). Totals update live. In dynasty, fair trades are usually within ~10% on each side.
      </div>
      <div style={{ display: 'grid', gridTemplateColumns: '1fr auto 1fr', gap: 16, alignItems: 'flex-start' }}>
        <TradeSide
          label="You give"
          total={totalA}
          winner={winner === 'A'}
          items={sideA}
          playersDb={playersDb}
          valueOf={valueOf}
          pickItems={pickItems}
          pickAvgByYearRound={pickAvgByYearRound}
          onRemove={id => remove('A', id)}
          onAdd={id => setSideA(s => [...s, id])}
          otherSide={sideB}
        />
        <div style={{ paddingTop: 38, fontSize: 18, color: C.fgMuted }} className="sd-display">↔</div>
        <TradeSide
          label="You get"
          total={totalB}
          winner={winner === 'B'}
          items={sideB}
          playersDb={playersDb}
          valueOf={valueOf}
          pickItems={pickItems}
          pickAvgByYearRound={pickAvgByYearRound}
          onRemove={id => remove('B', id)}
          onAdd={id => setSideB(s => [...s, id])}
          otherSide={sideA}
        />
      </div>
      {(sideA.length > 0 || sideB.length > 0) && (
        <div style={{ marginTop: 16, padding: 12, background: C.bgAlt, borderRadius: 3, fontSize: 13 }}>
          {winner === 'even' && <span><strong>≈ Roughly fair.</strong> Difference: {Math.round(Math.abs(diff)).toLocaleString()}</span>}
          {winner === 'A' && <span><strong style={{ color: C.danger }}>You'd be giving up more value.</strong> Net cost: {Math.round(diff).toLocaleString()} ({((diff / Math.max(totalA, 1)) * 100).toFixed(1)}%)</span>}
          {winner === 'B' && <span><strong style={{ color: C.success }}>You'd be getting more value.</strong> Net gain: {Math.round(-diff).toLocaleString()} ({((-diff / Math.max(totalB, 1)) * 100).toFixed(1)}%)</span>}
        </div>
      )}
    </div>
  );
};

// Helper: resolve any item ID (player or pick) to display info
const resolveItem = (id, playersDb, valueOf, pickItems, pickAvgByYearRound) => {
  if (id && id.startsWith('pick:')) {
    const [_, yr, rd] = id.split(':');
    return {
      isPick: true,
      name: `${yr} ${ordinal(parseInt(rd, 10))}`,
      position: 'PICK',
      team: '',
      value: pickAvgByYearRound?.[`${yr}-${rd}`] || 0,
    };
  }
  const p = playersDb?.[id];
  if (!p) return null;
  return {
    isPick: false,
    name: p.full_name || `${p.first_name || ''} ${p.last_name || ''}`.trim() || id,
    position: p.position || '?',
    team: p.team || 'FA',
    value: valueOf?.[id]?.value || 0,
  };
};

const TradeSide = ({ label, total, winner, items, playersDb, valueOf, pickItems, pickAvgByYearRound, onRemove, onAdd, otherSide }) => {
  const exclude = useMemo(() => [...items, ...otherSide], [items, otherSide]);
  return (
    <div>
      <div style={{ display: 'flex', alignItems: 'baseline', justifyContent: 'space-between', marginBottom: 8 }}>
        <div style={{ fontSize: 11, letterSpacing: '0.15em', textTransform: 'uppercase', color: C.fgSubtle, fontWeight: 700 }}>{label}</div>
        <div className="sd-mono" style={{ fontSize: 18, fontWeight: 700, color: winner ? C.success : C.fg }}>{Math.round(total).toLocaleString()}</div>
      </div>
      <PlayerPicker playersDb={playersDb} pickItems={pickItems} onPick={onAdd} exclude={exclude} />
      <div style={{ display: 'grid', gap: 4, marginTop: 8, minHeight: 60 }}>
        {items.length === 0 && <div style={{ padding: 10, background: C.bgAlt, borderRadius: 3, fontSize: 12, color: C.fgMuted, textAlign: 'center' }}>No assets added yet</div>}
        {items.map(id => {
          const info = resolveItem(id, playersDb, valueOf, pickItems, pickAvgByYearRound);
          if (!info) return null;
          return (
            <div key={id} style={{ display: 'flex', alignItems: 'center', padding: '6px 8px', background: C.bgAlt, borderRadius: 3, gap: 8 }}>
              <PosTag pos={info.position} />
              <div style={{ flex: 1, fontSize: 13, fontWeight: 600 }}>{info.name}{info.team && <span style={{ marginLeft: 6, fontSize: 10, color: C.fgSubtle, fontWeight: 400 }}>{info.team}</span>}</div>
              <div className="sd-mono" style={{ fontSize: 12, fontWeight: 700 }}>{Math.round(info.value).toLocaleString()}</div>
              <button onClick={() => onRemove(id)} style={{ border: 'none', background: 'transparent', color: C.fgMuted, cursor: 'pointer', fontSize: 14, padding: 0, width: 18 }} title="Remove">×</button>
            </div>
          );
        })}
      </div>
    </div>
  );
};

const PlayerPicker = ({ playersDb, pickItems = [], onPick, exclude = [] }) => {
  const [query, setQuery] = useState('');
  const [focused, setFocused] = useState(false);
  const excludeSet = useMemo(() => new Set(exclude), [exclude]);

  const results = useMemo(() => {
    if (!query || query.length < 2) return [];
    const q = query.toLowerCase();
    const out = [];

    // Match picks first (shorter list, often what users want)
    pickItems.forEach(p => {
      if (excludeSet.has(p.id)) return;
      if (p.name.toLowerCase().includes(q) || p.shortName.toLowerCase().includes(q)) {
        out.push({ id: p.id, isPick: true, label: p.name, sub: 'Rookie pick', value: p.value, position: 'PICK', team: '' });
      }
    });

    // Match players
    if (playersDb) {
      let added = 0;
      for (const [id, p] of Object.entries(playersDb)) {
        if (added >= 8) break;
        if (excludeSet.has(id)) continue;
        if (!p.position || !['QB', 'RB', 'WR', 'TE'].includes(p.position)) continue;
        if (!p.team && p.status !== 'Active') continue;
        const name = (p.full_name || `${p.first_name || ''} ${p.last_name || ''}`).toLowerCase();
        if (name.includes(q)) {
          out.push({
            id,
            isPick: false,
            label: p.full_name || `${p.first_name || ''} ${p.last_name || ''}`.trim(),
            sub: p.team || 'FA',
            position: p.position,
            team: p.team || 'FA',
          });
          added++;
        }
      }
    }
    return out.slice(0, 10);
  }, [query, playersDb, pickItems, excludeSet]);

  return (
    <div style={{ position: 'relative' }}>
      <input
        className="sd-input"
        value={query}
        onChange={e => setQuery(e.target.value)}
        onFocus={() => setFocused(true)}
        onBlur={() => setTimeout(() => setFocused(false), 200)}
        placeholder="Search player name or pick (e.g. '2026 1st')…"
        style={{ width: '100%', boxSizing: 'border-box' }}
      />
      {focused && results.length > 0 && (
        <div style={{ position: 'absolute', top: '100%', left: 0, right: 0, marginTop: 2, background: C.card, border: `1px solid ${C.border}`, borderRadius: 3, zIndex: 10, boxShadow: '0 8px 24px -8px rgba(0,0,0,0.15)', maxHeight: 280, overflowY: 'auto' }} className="sd-scrollbar">
          {results.map(r => (
            <div
              key={r.id}
              onMouseDown={() => { onPick(r.id); setQuery(''); }}
              style={{ padding: '8px 10px', cursor: 'pointer', display: 'flex', alignItems: 'center', gap: 8, borderBottom: `1px solid ${C.border}` }}
              onMouseEnter={e => e.currentTarget.style.background = C.bgAlt}
              onMouseLeave={e => e.currentTarget.style.background = 'transparent'}
            >
              <PosTag pos={r.position} />
              <div style={{ flex: 1, fontSize: 13, fontWeight: 600 }}>{r.label}</div>
              <div style={{ fontSize: 11, color: C.fgSubtle, fontFamily: 'JetBrains Mono, monospace' }}>{r.sub}</div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
};

   FOOTER

const Footer = () => (
  <div style={{ marginTop: 48, paddingTop: 20, borderTop: `1px solid ${C.border}`, fontSize: 11, color: C.fgSubtle, textAlign: 'center', lineHeight: 1.6 }}>
    Live data via Sleeper public API · No login or API key required<br />
    Player projections aren't exposed in Sleeper's public API · Matchup screens show actual scored points once games are played
  </div>
);

root.render(<SleeperDashboard />);
  </script>
